# Project permission rules for Gauntlet. Path denies stay out of this
# file: a session-wide Edit(src/**) deny would also block builders.
# git commit/push are allowed so git-committer (gemma4) can run them.
# Orchestrator, builders, and critics must still not invoke those commands.

[permission]
deny = [
  "Bash(git rebase*)",
  "Bash(sudo *)",
  "Bash(rm -rf /)",
  "Bash(rm -rf /*)",
]
