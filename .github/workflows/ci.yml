name: CI — tests, evaluation and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docs_only=false
          if [ "${EVENT_NAME}" != "pull_request" ]; then
            echo "Event is ${EVENT_NAME}. Not a pull request."
            echo "docs_only=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          mapfile -t changed < <(git diff --name-only --no-renames "${PR_BASE_SHA}" "${PR_HEAD_SHA}")
          echo "Changed files:"
          if [ "${#changed[@]}" -eq 0 ]; then
            echo "  (none)"
          else
            printf '  %s\n' "${changed[@]}"
          fi
          docs_only=true
          if [ "${#changed[@]}" -eq 0 ]; then
            docs_only=false
          fi
          for file in "${changed[@]}"; do
            case "${file}" in
              *.md|docs/*|docs/**|LICENSE*|.agents/**/*.md) ;;
              *) docs_only=false; break ;;
            esac
          done
          echo "Decision: docs_only=${docs_only}"
          echo "docs_only=${docs_only}" >> "${GITHUB_OUTPUT}"
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          node-version: '24'
          cache: npm
      - run: scripts/verify.sh
        if: steps.scope.outputs.docs_only != 'true'
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          name: simulation-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.docs_only != 'true'
        with:
          name: local-build
          path: dist
      - uses: actions/upload-artifact@v4
        if: always() && steps.scope.outputs.docs_only != 'true'
        with:
          name: browser-smoke
          path: artifacts/local/smoke/
# Publishing is intentionally disabled for this stage.
