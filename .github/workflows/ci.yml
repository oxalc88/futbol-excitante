name: CI — tests, evaluation and build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: scripts/verify.sh
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: local-build
          path: dist
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke
          path: artifacts/local/smoke/
# Publishing is intentionally disabled for this stage.
