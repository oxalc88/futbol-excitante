name: Publish Gauntlet tag

on:
  push:
    branches:
      - main
    paths:
      - gauntlet/VERSION.json

permissions:
  contents: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Gauntlet version
        id: version
        run: |
          VERSION=$(node -p "require('./gauntlet/VERSION.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish immutable Gauntlet tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          TAG="gauntlet-v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists; refusing to move it."
            exit 1
          fi
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "refs/tags/${TAG}"
