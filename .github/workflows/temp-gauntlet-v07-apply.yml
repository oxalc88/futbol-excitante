name: Temporary Gauntlet 0.7.0 Apply

on:
  push:
    branches:
      - feat/gauntlet-0.7.0-deterministic-audit
    paths:
      - .github/workflows/temp-gauntlet-v07-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/gauntlet-0.7.0-deterministic-audit
          fetch-depth: 0
      - name: Apply Gauntlet 0.7.0 changes
        run: python3 scripts/temp-apply-gauntlet-v07.py
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(gauntlet): add deterministic audit pipeline 0.7.0"
          git push origin HEAD:feat/gauntlet-0.7.0-deterministic-audit
