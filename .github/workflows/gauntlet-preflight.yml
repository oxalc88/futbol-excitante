name: Gauntlet full comparison (manual)

on:
  # A full release comparison is opt-in, not repeated on each maintenance push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        target: [base, head]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
      - uses: actions/checkout@v4
        with:
          # Frozen before-state; never infer a new historical baseline on rerun.
          ref: ${{ matrix.target == 'base' && 'd3dccf77c565102de531bc5aa981bea9aca009c3' || github.sha }}
          path: target
          fetch-depth: 0
      - uses: jdx/mise-action@v2
        with:
          working_directory: target
      - name: Install pinned dependencies and browser
        working-directory: target
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: 'true'
      - name: Full existing quality coverage plus new Gauntlet gates
        continue-on-error: true
        working-directory: target
        run: node ../source/scripts/ci/run-validation.mjs
        env:
          CI_TARGET_SHA: ${{ matrix.target == 'base' && 'd3dccf77c565102de531bc5aa981bea9aca009c3' || github.sha }}
          CI_REPORT_PATH: ../reports/${{ matrix.target }}.json
      - name: Save every check result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gauntlet-preflight-${{ matrix.target }}
          path: reports/${{ matrix.target }}.json
          if-no-files-found: error

  compare:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gauntlet-preflight-*
          merge-multiple: true
          path: reports
      - name: Apply existing regression policy without weakening any oracle
        run: node scripts/ci/classify-pr-validation.mjs reports/base.json reports/head.json reports/comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gauntlet-preflight-comparison
          path: reports/comparison.json
