name: Local stage — tests and build
on:
  push:
    branches: [rebuild/vision-first-2026-09-05]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vision-rebuild-local
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run evaluate
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: simulation-evidence
          path: artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: local-build
          path: dist
# Publishing is intentionally disabled for this stage.
