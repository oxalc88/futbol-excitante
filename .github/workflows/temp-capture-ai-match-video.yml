name: Temporary PR9 Post-Merge Validator

on:
  push:
    branches:
      - temp/capture-ai-match-video

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ai-match-ownership-regression
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      - name: Typecheck
        run: pnpm run typecheck
      - name: CPU and ownership regressions
        run: pnpm exec vitest run tests/unit/cpu-adapter/multi-player.test.ts tests/integration/ai-match-cpu-ownership.test.ts tests/integration/ai-match-autonomous-interaction.test.ts --project node
      - name: Gauntlet regression evals
        run: pnpm run gauntlet:eval
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser AI-match regression
        run: pnpm exec vitest run tests/browser/ai-match-screenshot.browser.test.ts --project browser
