name: Temporary PR9 Conflict Inspector

on:
  push:
    branches:
      - temp/capture-ai-match-video

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ai-match-ownership-regression
          fetch-depth: 0
      - name: Inspect merge with main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          set +e
          git merge --no-commit --no-ff origin/main
          status=$?
          echo "MERGE_STATUS=$status"
          echo "--- CONFLICTS ---"
          git diff --name-only --diff-filter=U
          echo "--- STATUS ---"
          git status --short
          echo "--- CONFLICT MARKERS ---"
          git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- . ':!gauntlet/state/**' || true
          exit 0
