name: Temporary PR9 Validator

on:
  push:
    branches:
      - temp/capture-ai-match-video

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/ai-match-ownership-regression
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      - name: Typecheck
        run: pnpm run typecheck
      - name: Focused AI-match integration regressions
        run: pnpm exec vitest run tests/integration/ai-match-cpu-ownership.test.ts tests/integration/ai-match-autonomous-interaction.test.ts --project node
      - name: Gauntlet regression evals
        run: pnpm run gauntlet:eval
      - name: Capture structured trajectory
        run: pnpm run capture-ai-trajectory
        env:
          WIP_SECTION: PR9-FINAL
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser AI-match regression
        run: pnpm exec vitest run tests/browser/ai-match-screenshot.browser.test.ts --project browser
      - name: Start Vite
        run: |
          pnpm exec vite --host 127.0.0.1 > /tmp/vite.log 2>&1 &
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/src/apps/browser/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/vite.log
          exit 1
      - name: Capture optional video evidence
        run: pnpm run capture-ai-video
        env:
          WIP_SECTION: PR9-FINAL
          WIP_VIDEO_MS: 3000
          WIP_ARTIFACT_NAME: pr9-final
      - uses: actions/upload-artifact@v4
        with:
          name: pr9-final-evidence
          path: docs/evidence/PR9-FINAL/
          if-no-files-found: error
          retention-days: 3
