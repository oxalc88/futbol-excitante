name: Temporary Gauntlet 0.7.0 Validate

on:
  push:
    branches:
      - feat/gauntlet-0.7.0-deterministic-audit
    paths:
      - .github/workflows/temp-gauntlet-v07-validate.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies for temporary validation
        run: |
          pnpm config set dangerously-allow-all-builds true
          pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Deterministic Gauntlet regressions
        run: pnpm run gauntlet:eval
      - name: Objective audit must expose current known gaps rather than silently pass
        run: |
          set +e
          pnpm run gauntlet:audit -- --objective CPU-TEAM-FORMATION --class DYNAMIC_VISUAL --tests-pass true --integration-test-pass true > /tmp/audit.out 2>&1
          code=$?
          set -e
          cat /tmp/audit.out
          test "$code" -ne 0
          grep -q '"status": "FAIL"' /tmp/audit.out
      - name: Acceptance persistence cannot bypass critic
        run: |
          set +e
          GAUNTLET_ACCEPTANCE_JSON='{"objective_id":"SYNTH","candidate_commit":"deadbeef","builder":{"agent":"builder-qwen","model":"qwen3.6"},"critic":{"agent":"critic","model":"deepseek-v4-flash-0731","verdict":"MISSING"},"integration":{"agent":"integration-reviewer","model":"deepseek-v4-flash-0731","verdict":"ACCEPT"},"deterministic_audit":{"status":"PASS"}}' pnpm run gauntlet:acceptance:persist > /tmp/persist.out 2>&1
          code=$?
          set -e
          cat /tmp/persist.out
          test "$code" -ne 0
          grep -q 'critic ACCEPT is mandatory' /tmp/persist.out
