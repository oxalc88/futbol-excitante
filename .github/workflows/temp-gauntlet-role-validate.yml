name: Temporary Gauntlet role validator

on:
  push:
    branches:
      - validate/gauntlet-0.8-role-refactor

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          PNPM_CONFIG_DANGEROUSLY_ALLOW_ALL_BUILDS: "true"
      - name: Typecheck
        run: pnpm run typecheck
      - name: Gauntlet deterministic evals
        run: pnpm run gauntlet:eval
      - name: Verify state files untouched vs main
        run: |
          git fetch origin main --depth=1
          if git diff --name-only origin/main...HEAD -- 'gauntlet/state/**' | grep -q .; then
            echo 'Unexpected gauntlet/state change'
            git diff --name-only origin/main...HEAD -- 'gauntlet/state/**'
            exit 1
          fi
