[tools]
node = "24.18.0"
pnpm = "11.10.0"

[settings]
lockfile = true

# ---------------------------------------------------------------------------
# Tasks — all invoke pnpm under the pinned Node environment.
# ---------------------------------------------------------------------------

[tasks.dev]
description = "Start the Vite browser laboratory"
run = "pnpm dev"

[tasks.sim-smoke]
description = "Run the versioned foundation scenario headlessly"
run = "pnpm run sim-smoke"

[tasks.replay-verify]
description = "Verify deterministic reconstruction from a replay.json"
run = "pnpm run replay-verify"

[tasks.eval-compare]
description = "Compare two artifact dirs; DELTA_ONLY never PASS"
run = "pnpm run eval-compare"

[tasks.typecheck]
description = "Run TypeScript type checking across all configs"
run = "pnpm run typecheck"

[tasks.test]
description = "Run Node Vitest project"
run = "pnpm run test"

[tasks.test-browser]
description = "Run browser Vitest + Playwright"
run = "pnpm run test-browser"

[tasks.test-all]
description = "Frozen-install check, typecheck, architecture/node/browser tests, headless smoke, Vite production build"
run = "pnpm run test-all"

[tasks.gauntlet-telemetry]
description = "Report measured runtime usage or record remote-verified acceptance"
run = "node scripts/gauntlet/telemetry.mjs"

[tasks.gauntlet-memory-validate]
description = "Validate bounded non-authoritative memory"
run = "pnpm run gauntlet:memory:validate"

[tasks.gauntlet-runtime-test]
description = "Verify runtime telemetry and efficiency integration"
run = "pnpm run gauntlet:runtime:test"

[tasks.gauntlet-deadlock-replay]
description = "Reproduce the exact a0f6161 ledger/stop with current policy (not product certification)"
run = "node --import tsx scripts/ci/reproduce-published-deadlock.ts"

[tasks.gauntlet-product-test]
description = "Run deterministic Gauntlet product policy regressions"
run = "pnpm run gauntlet:product:test"

[tasks.gauntlet-quality]
description = "Run the canonical Gauntlet verification command"
run = "pnpm run gauntlet:quality"

[tasks.test-git-personal-identity]
description = "Verify oxalc88 commit identity protection against real Git commits"
run = "node scripts/ci/test-personal-git-hooks.mjs"
