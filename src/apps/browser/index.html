<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PES Simulator</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div id="app">
    <!-- Setup menu overlay (hidden when URL params auto-start) -->
    <div id="setup-menu">
      <div id="setup-menu-card">
        <h1 id="setup-title">PES SIMULATOR</h1>
        <p id="setup-subtitle">Match Setup</p>

        <div class="setup-field">
          <label for="mode-select">Match Mode</label>
          <select id="mode-select">
            <option value="ai-match-5v5" selected>5v5 AI vs AI</option>
            <option value="human-vs-ai-5v5">5v5 Human vs CPU</option>
            <option value="human-vs-ai-5v3">5v3 Human vs CPU</option>
            <option value="ai-match-3v3">3v3 AI vs AI</option>
            <option value="human-vs-ai-3v3">3v3 Human vs CPU</option>
            <option value="human-vs-ai">2v2 Human vs CPU</option>
            <option value="2v2-ai">2v2 AI vs AI</option>
            <option value="human-vs-ai-1v1">1v1 Human vs CPU</option>
            <option value="ai-match">1v1 AI vs AI</option>
          </select>
        </div>

        <div class="setup-row">
          <div class="setup-field setup-half">
            <label for="team-a-name">Home Team</label>
            <input id="team-a-name" type="text" value="HOME" maxlength="16" />
          </div>
          <div class="setup-field setup-half">
            <label for="team-b-name">Away Team</label>
            <input id="team-b-name" type="text" value="AWAY" maxlength="16" />
          </div>
        </div>

        <div class="setup-field">
          <label for="difficulty-select">Difficulty</label>
          <select id="difficulty-select">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </div>

        <button id="start-button" type="button">START MATCH</button>
      </div>
    </div>

    <div id="game-container"></div>
    <div id="scoreboard">
      <div id="scoreboard-team-a">
        <span id="scoreboard-name-a" class="scoreboard-team-name">HOME</span>
        <span id="scoreboard-score-a" class="scoreboard-score">0</span>
      </div>
      <div id="scoreboard-center">
        <span id="scoreboard-clock">00:00</span>
        <span id="scoreboard-half" class="scoreboard-half-indicator">1H</span>
      </div>
      <div id="scoreboard-team-b">
        <span id="scoreboard-score-b" class="scoreboard-score">0</span>
        <span id="scoreboard-name-b" class="scoreboard-team-name">AWAY</span>
      </div>
    </div>
    <div id="hud">
      <div id="tick-display">Tick: 0</div>
      <div id="hash-display">Hash: —</div>
    </div>
    <div id="controls-hint">
      WASD: Move | Shift: Sprint | K: First Touch | J: Pass | L: Shot | Space: Switch
    </div>
    <button id="back-to-menu" type="button">BACK TO MENU</button>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
